esult becomes a new observation</text><path d="M885 910V954H1160V432H922" class="flow"/><text x="990" y="982" font-size="21" style="font-size:21px" class="muted" text-anchor="start">next step</text><path d="M275 910V944H100V1120" class="flow"/><path d="M275 944H380V1000" class="flow"/><text x="112" y="975" font-size="21" style="font-size:21px" class="muted" text-anchor="start">agrees</text><text x="395" y="978" font-size="21" style="font-size:21px" class="muted" text-anchor="start">disagrees</text><rect x="245" y="1000" width="275" height="82" rx="7" fill="var(--program)" stroke="var(--blue)" stroke-width="2"/><text x="382" y="1033" font-size="21" style="font-size:21px" class="" text-anchor="middle">Replace the root cause</text><text x="382" y="1063" font-size="21" style="font-size:21px" class="" text-anchor="middle">with the LLM's pick</text><path d="M382 1082V1120" class="flow"/><rect x="30" y="1120" width="490" height="130" rx="7" fill="var(--decision)" stroke="var(--teal)" stroke-width="2"/><text x="275" y="1151" font-size="18" style="font-size:18px" class="mono teal" text-anchor="middle">DECISION MODEL</text><text x="275" y="1187" font-size="27" style="font-size:27px" class="bold" text-anchor="middle">Pick the supporting evidence</text><text x="275" y="1221" font-size="21" style="font-size:21px" class="" text-anchor="middle">One yes or no per observation</text><path d="M275 1250V1290" class="flow"/><rect x="30" y="1290" width="490" height="130" rx="7" fill="var(--llm)" stroke="var(--orange)" stroke-width="2"/><text x="275" y="1321" font-size="18" style="font-size:18px" class="mono orange" text-anchor="middle">LLM</text><text x="275" y="1357" font-size="27" style="font-size:27px" class="bold" text-anchor="middle">Write the report and submit</text><text x="275" y="1391" font-size="21" style="font-size:21px" class="" text-anchor="middle">From the chosen observations only</text>
